# Publishes the website to GitHub Pages (crt.rw) on every update to main.
# Works both ways: a docs/ folder in the repo, or a docs.zip uploaded through
# the GitHub website (it's unzipped here automatically).
name: Deploy crt.rw

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site folder
        run: |
          if [ -f docs.zip ]; then
            unzip -q -o docs.zip -d _unzipped
            rm -rf _site && mv _unzipped/docs _site
          else
            cp -R docs _site
          fi
          rm -rf _site/__MACOSX
          find _site -name '.DS_Store' -delete
          # While holding/index.html exists, crt.rw shows the "coming soon" page and the
          # full site lives at crt.rw/preview/ (hidden from search engines).
          # To launch the full site, delete the holding folder on GitHub.
          if [ -f holding/index.html ]; then
            mv _site _preview && mkdir _site
            cp -R holding/. _site/
            mv _preview _site/preview
            rm -f _site/preview/CNAME
            find _site/preview -name '*.html' -exec sed -i 's#<head>#<head><meta name="robots" content="noindex,nofollow">#' {} +
            printf 'User-agent: *\nAllow: /\nDisallow: /preview/\n' > _site/robots.txt
          fi
          touch _site/.nojekyll
          test -f _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
